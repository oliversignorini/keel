[project]
name = "keel-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "celery>=5.6.3",
    "django~=6.0",
    "django-cors-headers>=4.9.0",
    "django-environ>=0.14.0",
    "djangorestframework>=3.18.0",
    "psycopg[binary]>=3.3.4",
    "redis>=8.1.0",
    "uuid-utils>=0.17.0",
]

[dependency-groups]
dev = [
    "django-stubs>=6.1.0",
    "factory-boy>=3.3.3",
    "import-linter>=2.13",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "ruff>=0.16.4",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "--cov=keel --cov=config --cov-report=json --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ", "RUF"]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
python_version = "3.12"
disallow_untyped_defs = true
warn_return_any = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["celery.*", "environ.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

# Per-directory coverage gate (PRD §4, invariant 7), enforced by
# scripts/check_coverage.py — see that file for the mechanism.
#
# Empty in Phase 0 on purpose: every row in the PRD's coverage table
# (services.py, keel/domain/, organizations/permissions.py,
# billing/credits.py, Stripe webhooks, adapters) names a path that Phase 0
# is explicitly forbidden from creating. Phase 1 onward adds a glob the
# moment the path it covers exists, per "paths that do not exist yet
# omitted" in docs/plans/phase-0.md task 0.8.
[tool.keel.coverage]

[tool.importlinter]
root_packages = ["config", "keel"]
include_external_packages = true

[[tool.importlinter.contracts]]
# source_modules uses a wildcard ("keel.domain.**") rather than the literal
# "keel.domain" on purpose: import-linter raises a hard error if a literal
# source module name does not exist in the graph, which would make this
# contract fail the build outright while keel/domain/ is absent, rather
# than pass silently as PRD §4 invariant 1 requires. A wildcard expression
# resolves to an empty set (not an error) when nothing matches, and
# matches every module added under keel/domain/ once the directory exists.
name = "keel.domain is independent"
type = "forbidden"
source_modules = ["keel.domain.**"]
forbidden_modules = [
    "django",
    "celery",
    "config",
    "keel.core",
    "keel.accounts",
    "keel.organizations",
    "keel.billing",
    "keel.audit",
    "keel.notifications",
    "keel.files",
    "keel.widgets",
]

[[tool.importlinter.contracts]]
name = "keel.core does not import keel.organizations"
type = "forbidden"
source_modules = ["keel.core"]
forbidden_modules = ["keel.organizations"]

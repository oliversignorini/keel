[project]
name = "keel-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.83",
    "celery>=5.6.3",
    "cryptography>=50.0.1",
    "django~=6.0",
    "django-allauth[headless-spec,mfa,socialaccount]>=65.19.1",
    "django-cors-headers>=4.9.0",
    "django-environ>=0.14.0",
    "django-ninja>=1.6.3,<2",
    # WSGI server for the `api` Railway service (.railway/railway.ts) — not
    # needed in dev, where `manage.py runserver` is the whole story.
    "gunicorn>=23.0.0",
    "posthog>=7.44.2",
    "psycopg[binary]>=3.3.4",
    "redis>=8.1.0",
    "requests>=2.32.3",
    "sentry-sdk[celery,django]>=2.68.0",
    "stripe>=15.6.0",
    "uuid-utils>=0.17.0",
    "uvicorn>=0.34.0",
    # Serves collected static files (Django admin CSS/JS) in production —
    # apps/api/config/settings/prod.py wires WhiteNoiseMiddleware and
    # STORAGES. Not used in dev, where DEBUG=True serves them directly.
    "whitenoise>=6.8.0",
]

[dependency-groups]
dev = [
    "bandit>=1.8.0",
    "django-stubs>=6.1.0",
    "factory-boy>=3.3.3",
    "import-linter>=2.14",
    "moto[s3]>=5.2.3",
    "mypy>=2.3.1",
    "pip-audit>=2.7.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "ruff>=0.16.5",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "--cov=keel --cov=config --cov-report=json --cov-report=term-missing"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ", "RUF"]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
python_version = "3.12"
disallow_untyped_defs = true
warn_return_any = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["tests.*", "keel.*.tests.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["celery.*", "environ.*", "allauth.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

# Per-directory coverage gate (invariant 7), enforced by
# scripts/check_coverage.py — see that file for the mechanism.
#
# A path earns a row here only once it exists: a glob naming a directory
# that has not been created yet gates nothing while reading as though it
# did.
#
# keel/core is the first real obligation: the authz registry, the
# exception handler, the pagination class, the audit decorators, the
# crypto seam and the id generator are all load-bearing and all cheap to
# test — 100% is what these modules actually achieve, not an aspiration.
# Modules listed explicitly rather than "keel/core/*.py": fnmatch's "*"
# matches "/" too, so a single-segment glob would also reach
# keel/core/tests/*.py, where a fixture function's body legitimately
# goes uncovered whenever a test only asserts on its registration and
# never calls it.
[tool.keel.coverage]
"keel/core/ids.py" = 100
"keel/core/auth.py" = 100
"keel/core/checks.py" = 100
"keel/core/models.py" = 100
"keel/core/exceptions.py" = 100
"keel/core/authz.py" = 100
"keel/core/audit.py" = 100
"keel/core/pagination.py" = 100
"keel/core/tasks.py" = 100
"keel/core/crypto.py" = 100
"keel/core/logging.py" = 100
"keel/core/middleware.py" = 100
# Permission registry (invariant 2) — the two
# CI meta-tests are the specified enforcement mechanism for guard test
# coverage; 100% here catches ordinary dead code the meta-tests wouldn't
# (an unreachable branch inside a guard, an unused helper).
"keel/organizations/permissions.py" = 100
"keel/organizations/resolvers.py" = 100
"keel/organizations/roles.py" = 100
# The credit ledger arithmetic (invariant 7) — pure arithmetic over rows,
# so 100% is the achievable floor rather than an aspiration.
"keel/billing/credits.py" = 100

[tool.importlinter]
root_packages = ["config", "keel"]
include_external_packages = true

[[tool.importlinter.contracts]]
# source_modules uses a wildcard ("keel.domain.**") rather than the literal
# "keel.domain" on purpose: import-linter raises a hard error if a literal
# source module name does not exist in the graph, which would make this
# contract fail the build outright while keel/domain/ is absent, rather
# than pass silently as invariant 1 requires. A wildcard expression
# resolves to an empty set (not an error) when nothing matches, and
# matches every module added under keel/domain/ once the directory exists.
name = "keel.domain is independent"
type = "forbidden"
source_modules = ["keel.domain.**"]
forbidden_modules = [
    "django",
    "celery",
    "config",
    "keel.core",
    "keel.accounts",
    "keel.organizations",
    "keel.billing",
    "keel.audit",
    "keel.notifications",
    "keel.files",
    "keel.widgets",
]

[[tool.importlinter.contracts]]
name = "keel.core does not import keel.organizations"
type = "forbidden"
source_modules = ["keel.core"]
forbidden_modules = ["keel.organizations"]

# Bandit. Runs over keel/ in the `lint` job,
# invoked with `-x '*/tests/*,*/migrations/*'` — CLI excludes, not
# exclude_dirs here, because bandit's config-file exclude_dirs matches
# directory names, not globs, and silently fails to exclude
# keel/<app>/tests for every app.
[tool.bandit]
# B101 (assert_used): asserts are used throughout as documented
# invariant checks after a queryset already guarantees the condition
# (e.g. keel/billing/services.py:244's trial_end__isnull=False query),
# not as request validation — nothing security-relevant depends on them
# surviving `python -O`.
# B311 (blacklist / random): keel/core/tasks.py and keel/jobs/runner.py
# use `random.uniform` only to jitter retry backoff timing, never for a
# token, key, or anything an attacker could predict to their advantage.
skips = ["B101", "B311"]

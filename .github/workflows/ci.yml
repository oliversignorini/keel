name: CI

on:
  push:
  pull_request:

env:
  PNPM_VERSION: "9.5.0"
  NODE_VERSION: "22"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Install Python dependencies
        working-directory: apps/api
        run: uv sync --frozen

      - name: ruff check
        working-directory: apps/api
        run: uv run ruff check .

      - name: ruff format --check
        working-directory: apps/api
        run: uv run ruff format --check .

      - name: mypy
        working-directory: apps/api
        run: uv run mypy .

      - name: eslint
        run: pnpm --filter web lint

      - name: prettier --check
        run: pnpm exec prettier --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: typecheck
        run: pnpm --filter web typecheck && pnpm --filter @keel/api-client typecheck

  test-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: keel
          POSTGRES_USER: keel
          POSTGRES_PASSWORD: keel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U keel -d keel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://keel:keel@localhost:5432/keel
      REDIS_URL: redis://localhost:6379/0
      DJANGO_SETTINGS_MODULE: config.settings.test
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Install Python dependencies
        working-directory: apps/api
        run: uv sync --frozen

      - name: makemigrations --check --dry-run
        working-directory: apps/api
        run: uv run python manage.py makemigrations --check --dry-run
        # No models exist yet in Phase 0 — this step is a no-op until
        # Phase 1's baseline migration, and CI fails loudly the day
        # someone adds a model without its migration.

      - name: pytest
        working-directory: apps/api
        run: uv run pytest

      - name: check_coverage.py
        run: python3 scripts/check_coverage.py

  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: vitest
        run: pnpm --filter web test

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Install Python dependencies
        working-directory: apps/api
        run: uv sync --frozen

      - name: lint-imports
        working-directory: apps/api
        run: uv run lint-imports

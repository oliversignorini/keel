name: CI

on:
  push:
  pull_request:

env:
  PNPM_VERSION: "9.5.0"
  NODE_VERSION: "22"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Install Python dependencies
        working-directory: apps/api
        run: uv sync --frozen

      - name: ruff check
        working-directory: apps/api
        run: uv run ruff check .

      - name: ruff format --check
        working-directory: apps/api
        run: uv run ruff format --check .

      - name: mypy
        working-directory: apps/api
        run: uv run mypy .

      - name: check_permission_lint.py
        working-directory: apps/api
        run: uv run python ../../scripts/check_permission_lint.py

      - name: check_unsafe_rendering.py
        working-directory: apps/api
        run: uv run python ../../scripts/check_unsafe_rendering.py

      - name: bandit
        working-directory: apps/api
        run: uv run bandit -c pyproject.toml -r keel -x '*/tests/*,*/migrations/*'
        # Exclusions and skipped rule IDs are in apps/api/pyproject.toml's
        # [tool.bandit], each with a comment explaining why it's a false
        # positive here.

      - name: eslint
        run: pnpm --filter web lint

      - name: prettier --check
        run: pnpm exec prettier --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: typecheck
        run: pnpm --filter web typecheck && pnpm --filter @keel/api-client typecheck

  test-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: keel
          POSTGRES_USER: keel
          POSTGRES_PASSWORD: keel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U keel -d keel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://keel:keel@localhost:5432/keel
      REDIS_URL: redis://localhost:6379/0
      DJANGO_SETTINGS_MODULE: config.settings.test
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Install Python dependencies
        working-directory: apps/api
        run: uv sync --frozen

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build email templates
        run: pnpm --filter @keel/emails build
        # react-email templates are authored as .tsx and rendered to HTML
        # at build time (PRD Integration points: "rendered to HTML at
        # build, sent from Django"). keel/notifications reads those built
        # files, so every allauth flow that sends mail — signup, email
        # verification, password reset — raises EmailTemplateMissing
        # without this step. packages/emails/dist is a build artifact and
        # is not committed, so CI must produce it before pytest runs.

      - name: makemigrations --check --dry-run
        working-directory: apps/api
        run: uv run python manage.py makemigrations --check --dry-run
        # No models exist yet in Phase 0 — this step is a no-op until
        # Phase 1's baseline migration, and CI fails loudly the day
        # someone adds a model without its migration.

      - name: manage.py check --deploy
        working-directory: apps/api
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          # Obvious placeholders, not real secrets — this only imports
          # config.settings.prod far enough to run Django's system checks;
          # nothing here binds a port or talks to Stripe/Sentry/etc.
          # DJANGO_SECRET_KEY IS now overridden (phase 16.B,
          # keel.core.checks.check_secret_key_not_default): base.py's own
          # insecure default is now a hard Error under
          # KEEL_ENFORCE_PRODUCTION_CHECKS (set unconditionally in
          # config/settings/prod.py), not merely security.W009's warning —
          # a real deployment must set this too, this is a CI-only stand-in.
          DJANGO_SECRET_KEY: "not-a-real-secret-but-long-and-random-enough-for-ci-52chars"
          DJANGO_ALLOWED_HOSTS: "lvh.me,.lvh.me,localhost,127.0.0.1"
          DJANGO_SECURE_SSL_REDIRECT: "true"
          KEEL_ENCRYPTION_KEY: O-fOj6lG4KEcdbIbgEHBP8o0lMTG4dH-I_9ICP96te8=
        run: uv run python manage.py check --deploy --fail-level WARNING
        # `check --deploy` only fails the process on an Error by default —
        # a new warning-level finding would go on printing in a green job
        # forever, so 16.D's --fail-level WARNING makes that failure mode
        # structural. 16.B separately made the weak-SECRET_KEY case a
        # blocking Error (keel.core.E005), so no silence list is needed.

      - name: pytest
        working-directory: apps/api
        run: uv run pytest

      - name: pytest (MFA enabled)
        working-directory: apps/api
        run: uv run pytest keel/accounts/tests/test_mfa_flow.py --no-cov --ds=config.settings.test_mfa
        # config.settings.test (the default above) runs with
        # KEEL_MFA_ENABLED=false and asserts the TOTP endpoints are
        # absent; this run exercises the "flag on" half of that same
        # acceptance criterion (PRD §8 Phase 2 A.4) against the settings
        # module where allauth.mfa is actually installed.

      - name: check_coverage.py
        run: python3 scripts/check_coverage.py

  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build content collections
        run: pnpm --filter web content:build
        # app/sitemap.ts imports the generated "content-collections" module.
        # It is produced by the content-collections build (and, incidentally,
        # by `next dev`, which is why this passes locally and failed here).
        # apps/web/.content-collections is generated output and is gitignored,
        # so a fresh checkout starts without it and vitest cannot resolve the
        # import at all.

      - name: vitest (web)
        run: pnpm --filter web test

      - name: vitest (api-client)
        run: pnpm --filter @keel/api-client test

  api-client-generation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate the client and diff against what's committed
        working-directory: packages/api-client
        run: |
          pnpm generate
          git diff --exit-code -- src/generated
        # A stale src/generated is a build error (keel-prd.md §4 "Type
        # synchronisation"), not a runtime surprise — package.json says
        # never hand-edit it, and this is what makes that true. Once
        # p2-auth-api lands the merged spec and orval.config.ts's
        # input.target moves to it, this job also proves the merge is
        # deterministic run to run (a reordering merge would fail here
        # randomly, which is exactly the failure mode A.3 warns about).

  e2e:
    # Was "e2e-accessibility" — renamed because it now also runs
    # e2e/auth-flows.spec.ts against a live API, not only axe-core
    # (docs/plans/phase-9.md 9.C).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: keel
          POSTGRES_USER: keel
          POSTGRES_PASSWORD: keel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U keel -d keel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "wget --quiet --tries=1 --spider http://localhost:8025/livez"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # lvh.me is a public DNS name whose wildcard resolves to 127.0.0.1
      # (see .env.example's "Subdomain routing" block) — used as-is here
      # rather than /etc/hosts entries, since GitHub-hosted runners have
      # outbound DNS. auth-flows.spec.ts exercises the cross-host cookie
      # behaviour (apex vs `app.`) that plan 6.A introduced, so the apex
      # and the app host both need to be real, distinct hosts, not both
      # "localhost".
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_SECRET_KEY: e2e-ci-placeholder-not-for-prod-use
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: "lvh.me,.lvh.me,localhost,127.0.0.1"
      DATABASE_URL: postgres://keel:keel@localhost:5432/keel
      REDIS_URL: redis://localhost:6379/0
      KEEL_APP_DOMAIN: app.lvh.me
      DJANGO_SESSION_COOKIE_DOMAIN: .lvh.me
      DJANGO_CSRF_TRUSTED_ORIGINS: http://app.lvh.me:3100,http://lvh.me:3100
      # Empty since Phase 11 (docs/adr/0002-auth-bff-shape.md): the Next.js
      # BFF proxy terminates every /api/v1 and /_allauth call server-side,
      # so the browser never makes a credentialed cross-origin fetch to
      # Django directly in this suite — CORS has nothing to allow.
      DJANGO_CORS_ALLOWED_ORIGINS: ""
      KEEL_FRONTEND_URL: http://lvh.me:3100
      KEEL_APP_FRONTEND_URL: http://app.lvh.me:3100
      EMAIL_HOST: localhost
      EMAIL_PORT: "1025"
      KEEL_ENCRYPTION_KEY: O-fOj6lG4KEcdbIbgEHBP8o0lMTG4dH-I_9ICP96te8=
      # Server-only — the Next.js process (not the browser) dials Django
      # directly through these (apps/web/lib/api/internal-origins.ts).
      KEEL_API_INTERNAL_URL: http://api.lvh.me:8000
      KEEL_API_STREAM_INTERNAL_URL: http://localhost:8001
      NEXT_PUBLIC_SITE_URL: http://lvh.me:3100
      E2E_BASE_URL: http://lvh.me:3100
    steps:
      - uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Install Python dependencies
        working-directory: apps/api
        run: uv sync --frozen

      - name: Build email templates
        run: pnpm --filter @keel/emails build
        # Same reason as the test-api job's identical step: allauth's
        # signup/verify/reset emails read packages/emails/dist, which is
        # a gitignored build artifact.

      - name: Migrate the database
        working-directory: apps/api
        run: uv run python manage.py migrate

      - name: Start the Django API in the background
        working-directory: apps/api
        run: |
          uv run python manage.py runserver 0.0.0.0:8000 > /tmp/django-e2e.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/healthz/ > /dev/null; then
              echo "Django is up"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Django did not become healthy within 30s"
          cat /tmp/django-e2e.log
          exit 1

      - name: Install Playwright browsers
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: axe-core on every auth and account route
        working-directory: apps/web
        run: pnpm exec playwright test e2e/accessibility.spec.ts

      - name: Signup, login, logout, and password reset against the live API
        id: auth_flows
        working-directory: apps/web
        continue-on-error: true
        run: pnpm exec playwright test e2e/auth-flows.spec.ts
        # Still non-blocking after Phase 11 (Auth BFF hardening) — but for
        # a different reason than before. The BFF proxy itself (the
        # thing this phase built) is verified working end to end against
        # this exact stack: signup/login/config all reach Django through
        # apps/web/app/api/v1/[...path] and .../api/internal/allauth/
        # [...path], CSRF and cookie relay both check out, and the
        # cross-host apex<->app redirect and the pending-session /login
        # ping-pong (lib/auth/route-guard.ts) are both fixed. What still
        # blocks all 3 tests is upstream of the BFF entirely: a fresh
        # `EmailAddress` row comes back `verified=True` immediately after
        # signup even though `ACCOUNT_EMAIL_VERIFICATION="mandatory"` —
        # confirmed directly in a Django shell, no HTTP layer involved —
        # so the emailed confirmation key's own `EmailConfirmationHMAC.
        # from_key()` correctly refuses to re-verify an already-verified
        # address and reports "invalid or expired". The existing backend
        # test (`keel/accounts/tests/test_auth_flows.py::_signup_and_verify`)
        # already tolerates exactly this ambiguity — it asserts the verify
        # call's status is `in (200, 401)` rather than requiring 200 —
        # which reads as this having been a known, unexplained flake
        # before this phase, not something Phase 11 introduced. Allauth/
        # email-verification internals are explicitly out of this phase's
        # ownership (docs/plans/phase-11.md's Boundary table) — flagging
        # for whoever owns that surface next, see the Phase 11 report.

      - name: Annotate auth-flows failure
        if: steps.auth_flows.outcome == 'failure'
        run: |
          echo "e2e/auth-flows.spec.ts failed (non-blocking — see the previous step's comment for the known upstream cause)." >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=auth-flows.spec.ts failed::e2e/auth-flows.spec.ts failed — non-blocking, see the 'Signup, login, logout, and password reset against the live API' step's comment for the known cause."
        # A step-level annotation, not a new job (docs/plans/phase-16.md
        # 16.D) — continue-on-error keeps this job green even when the
        # spec fails, which is exactly what made the finding invisible
        # before; this puts it on the run summary and PR annotations tab
        # without spending any more Actions minutes on it.

  contracts:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: keel
          POSTGRES_USER: keel
          POSTGRES_PASSWORD: keel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U keel -d keel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://keel:keel@localhost:5432/keel
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Install Python dependencies
        working-directory: apps/api
        run: uv sync --frozen

      - name: lint-imports
        working-directory: apps/api
        run: uv run lint-imports

      - name: merge_openapi.py produces the committed spec (client not stale)
        working-directory: apps/api
        run: |
          uv run python ../../scripts/merge_openapi.py
          git diff --exit-code -- ../../openapi.merged.json || {
            echo "::error::openapi.merged.json is stale — run scripts/merge_openapi.py and commit the result.";
            exit 1;
          }

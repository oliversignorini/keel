# gitleaks config. Extends the default
# ruleset rather than replacing it — Keel has no rules of its own to add,
# only known false positives to allowlist.
[extend]
useDefault = true

# .env.example's KEEL_ENCRYPTION_KEY is a Fernet key generated purely as
# an illustration of the expected shape (see the comment above it in that
# file) and is committed on purpose — nothing rotates it because nothing
# real was ever encrypted with it. It also appears in the history of the
# already-removed .env.bak (7fd5a99, "Untrack .env.bak..."), which is
# itself dev-only placeholders per that commit's own message. Path-based
# rather than a secret-specific regex, so a future placeholder added to
# either file does not need a matching new allowlist entry.
#
# openapi.merged.json is scripts/merge_openapi.py's committed output
# (the `contracts` CI job fails if it drifts). Its example access_token /
# session_token values come straight from django-allauth's own headless
# OpenAPI spec as illustrative response bodies, not credentials for
# anything that exists.
[[allowlists]]
description = "Documented dev-only placeholder files, not real secrets"
paths = [
  '''(^|/)\.env\.example$''',
  '''(^|/)\.env\.bak$''',
  '''(^|/)openapi\.merged\.json$''',
]

# The same illustrative Fernet key from .env.example is reused verbatim in
# .github/workflows/ci.yml env blocks so CI tests exercise the crypto path.
# Allowlist the value itself rather than the workflows directory, so any
# *other* secret landing in a workflow file still fails the scan.
[[allowlists]]
description = "Illustrative Fernet key reused in CI env blocks"
regexes = ['''O-fOj6lG4KEcdbIbgEHBP8o0lMTG4dH-I_9ICP96te8=''']

# scripts/init.ts once carried a Stripe-shaped placeholder string (commit
# 88233bd); the string was replaced at HEAD with one that can't match the
# rule, but the full-history scan (--log-opts=--all) still sees the old
# commit. Commit+path pins exactly that one historical occurrence — a new
# Stripe-looking string anywhere, including in that file, still fails.
[[allowlists]]
description = "Historical placeholder in scripts/init.ts, fixed at HEAD"
commits = ["88233bd9d77655412b69ba545056fdfb3d3959bb"]
paths = ['''^scripts/init\.ts$''']
